# Reused by separate stage and prod Komodo projects. The alias is unique on
# shared ingress, and runtime config binds each admin to its own API origin.
services:
  admin:
    build: ..
    image: maproulette-mobile-admin:${MR_DEPLOYMENT:?Set stage or prod}
    pull_policy: build
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: https://${MR_API_HOST:?Set the matching API host}
      CLIENT_ID: maproulette-mobile-admin
      # Header badge follows the selected backend; stage/prod are valid explicit values.
      ADMIN_ENVIRONMENT: ${MR_DEPLOYMENT:?Set stage or prod}
      # Separate claim client; real OSM site, with publication still gated by backend policy.
      CLAIM_CLIENT_ID: ${CLAIM_CLIENT_ID:-maproulette-claim}
      OSM_WEB: https://www.openstreetmap.org
      # Verified artifacts only. Empty values leave installation unavailable.
      INSTALL_URL: ${INSTALL_URL:-}
      ANDROID_INSTALL_URL: ${ANDROID_INSTALL_URL:-}
      ANDROID_VERSION: ${ANDROID_VERSION:-}
      # Both actual Apple IDs are needed to serve AASA; otherwise leave empty.
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      ingress:
        aliases:
          - ${MR_ADMIN_NETWORK_ALIAS:?Set a unique admin network alias}

networks:
  ingress:
    name: schaaltreinenhuis-ingress
    external: true
