[project]
name = "extractor"
version = "0.1.0"
description = "Convert an OSM PBF into the survey builder's Point FeatureCollection input (prototype)"
requires-python = ">=3.10"
dependencies = ["osmium>=4.3,<5", "shapely>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["extractor", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
